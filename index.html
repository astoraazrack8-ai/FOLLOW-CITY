<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101b2b"><meta name="mobile-web-app-capable" content="yes"><title>FOLLOW CITY</title>
<style>
:root{--glass:#12243bdc;--stroke:#ffffff2b;--gold:#ffd36a;--mint:#73efb6}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ac9d8;color:#fff;font-family:system-ui,"Segoe UI",sans-serif;touch-action:none}#game{position:absolute;inset:0}canvas{display:block}.hud{position:absolute;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;gap:7px;pointer-events:none}.logo,.stat,.tool,.panel,.round{background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(12px);box-shadow:0 5px 18px #07111c55;border-radius:15px}.logo{padding:8px 12px;font-weight:950;color:var(--gold)}.stats{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.stat{padding:7px 9px;font-size:12px;white-space:nowrap}.stat b{color:var(--mint)}.tools{position:absolute;right:10px;top:76px;display:flex;flex-direction:column;gap:8px}.tool{color:#fff;padding:10px 12px;min-width:66px;font-weight:800;font-size:12px}.tool .ico{display:block;font-size:23px;margin-bottom:2px}.tool.active{outline:2px solid var(--gold);background:#34536b}.bottom{position:absolute;bottom:env(safe-area-inset-bottom,9px);left:10px;right:10px;display:flex;align-items:end;justify-content:center;pointer-events:none}.panel{pointer-events:auto;padding:10px}.build{width:min(94vw,720px);max-height:34vh;overflow:auto;transition:transform .2s,opacity .2s}.hidden{display:none!important}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:8px}.tab{border:1px solid var(--stroke);background:#203a51;color:#fff;border-radius:12px;padding:9px 13px;white-space:nowrap;font-weight:800}.tab.active{background:#a86b25}.items{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.item{min-width:105px;border:1px solid var(--stroke);background:linear-gradient(145deg,#294b62,#172b41);color:#fff;border-radius:13px;padding:9px 7px;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px}.itemIcon{font-size:26px}.item small{color:var(--gold)}.hint{position:absolute;top:62px;left:10px;background:var(--glass);padding:8px 11px;border-radius:12px;font-size:11px;pointer-events:none}.toast{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);background:#10243aee;border:1px solid var(--stroke);padding:12px 18px;border-radius:13px;display:none;text-align:center;max-width:85vw}.placement{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--glass);padding:9px;border:1px solid var(--stroke);border-radius:14px}.placement button,.settingBtn{border:0;border-radius:11px;padding:10px 14px;font-weight:900;color:#fff}.confirm{background:#159b64}.cancel{background:#a63b43}.valid{color:#7dffc0;font-weight:900}.invalid{color:#ff8d8d;font-weight:900}.modal{position:absolute;inset:0;background:#07111caa;display:flex;align-items:center;justify-content:center;padding:18px}.modal .panel{width:min(92vw,390px)}.modal h2{margin:0 0 12px;color:var(--gold)}.settingBtn{display:block;width:100%;margin:8px 0;background:#29465d;text-align:right}.close{background:#a86b25}.rotate{display:none;position:absolute;inset:0;background:#101b2b;z-index:20;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px}@media(max-width:650px){.stat{font-size:10px;padding:6px}.logo{font-size:11px;padding:7px}.tools{top:68px;right:7px;gap:6px}.tool{min-width:57px;padding:7px 6px;font-size:10px}.tool .ico{font-size:20px}.hint{top:60px;left:7px;font-size:9px;max-width:55vw}.build{max-height:30vh}.item{min-width:90px}.placement{bottom:10px;max-width:95vw;font-size:11px}.placement button{padding:9px}}@media(orientation:portrait){.rotate{display:flex}}
</style></head><body><div id="game"></div><div class="rotate">↻<br>لأفضل تجربة في FOLLOW CITY<br>أدر هاتفك إلى الوضع الأفقي</div>
<div class="hud"><div class="logo">🏙 FOLLOW CITY</div><div class="stats"><div class="stat">💰 <b id="money">5000</b></div><div class="stat">👥 <b id="people">120</b></div><div class="stat">⭐ <b id="followers">120</b></div><div class="stat">❤️ <b id="likes">45</b></div><div class="stat">😊 <b id="happy">85%</b></div></div><div class="logo">☀️ <span id="day">1</span></div></div>
<div class="hint">اسحب لتحريك الكاميرا • بإصبعين للتقريب والتدوير</div><div class="tools"><button class="tool active" id="buildMode"><span class="ico">🏗️</span>بناء</button><button class="tool" id="roadMode"><span class="ico">🛣️</span>طرق</button><button class="tool" id="bulldozeMode"><span class="ico">🚜</span>هدم</button><button class="tool" id="inventoryBtn"><span class="ico">🎒</span>المخزن</button><button class="tool" id="saveBtn"><span class="ico">💾</span>حفظ</button><button class="tool" id="settingsBtn"><span class="ico">⚙️</span>إعدادات</button></div>
<div class="bottom"><div class="panel build hidden" id="buildPanel"><div class="tabs" id="tabs"></div><div class="items" id="items"></div></div></div><div class="placement hidden" id="placementBar"><span id="placementState" class="valid">✓ مكان صالح للبناء</span><button class="confirm" id="confirmBuild">تأكيد ✓</button><button class="cancel" id="cancelBuild">إلغاء ✕</button></div>
<div class="modal hidden" id="settingsModal"><div class="panel"><h2>⚙️ إعدادات FOLLOW CITY</h2><button class="settingBtn" id="musicToggle">🎵 الموسيقى: تشغيل</button><button class="settingBtn" id="sfxToggle">🔊 المؤثرات: تشغيل</button><button class="settingBtn" id="vibeToggle">📳 الاهتزاز: إيقاف</button><button class="settingBtn">🎮 التحكم والكاميرا</button><button class="settingBtn">🌍 جودة الرسومات: تلقائي</button><button class="settingBtn">💾 الحفظ التلقائي: تشغيل</button><button class="settingBtn close" id="closeSettings">إغلاق</button></div></div><div class="toast" id="toast"></div>
<script type="module" src="/main.js"></script></body></html>
